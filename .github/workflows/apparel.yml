name: apparel
on:
  push:
    paths: ["apparel/**", "store/**", ".github/workflows/apparel.yml"]
  pull_request:
    paths: ["apparel/**", "store/**", ".github/workflows/apparel.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apparel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
